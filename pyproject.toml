[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "latticegen"
version = "1.0.0"
description = "Periodic lattice structures (Fourier synthesis, distance fields, TPMS) for DLP 3D printing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-image>=0.20", "trimesh>=4.0"]

[project.optional-dependencies]
remesh = ["pymeshlab>=2023.12"]

[project.scripts]
latticegen = "latticegen.cli:main"

[tool.setuptools]
packages = ["latticegen"]
